{{ define "main" }}
<main>
  <article>
    {{ partial "page-header.html" (dict "title" .Title) }}
    {{ with .Content }}
    <div class="max-w-2xl px-6 mx-auto mt-6 prose">
      {{- . -}}
    </div>
    {{ end }} {{ partial "pricings-template.html" . }}
  </article>
  <div class="max-w-xl mx-auto my-16">
    {{ partial "pagination" . }}
  </div>
</main>
{{ end }}
