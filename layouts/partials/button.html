{{/*
  button: dict params
  - href (string, required when type is not set)
  - label (string, required)
  - size (string, optional: default | sm | lg; default px-6, sm px-4 text-sm, lg px-8 py-4 text-base)
  - type (string, optional: when set, renders <button type="..."> instead of <a href>)
*/}}
{{- $size := .size | default "default" -}}
{{- $sizeClass := "px-6" -}}
{{- if eq $size "sm" -}}
  {{- $sizeClass = "px-4 text-sm" -}}
{{- else if eq $size "lg" -}}
  {{- $sizeClass = "px-8 py-4 text-base" -}}
{{- end -}}
{{- $class := printf "inline-flex items-center justify-center min-h-11 %s rounded-lg font-semibold bg-cta text-foreground hover:bg-turquoise-deep hover:text-background focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring" $sizeClass -}}
{{- if .type -}}
<button type="{{ .type }}" class="{{ $class }}">{{ .label }}</button>
{{- else -}}
<a href="{{ .href }}" class="{{ $class }}">{{ .label }}</a>
{{- end -}}
