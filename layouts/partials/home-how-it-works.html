<!-- How It Works: 3-step participant journey -->
<div class="max-w-6xl mx-auto px-6 py-24 md:px-8">
  <h2 class="text-lg sm:text-xl md:text-2xl lg:text-3xl font-semibold text-left text-foreground">
    {{ .title }}
  </h2>

  <div class="grid gap-6 mt-12 md:grid-cols-3">
    {{ range .steps }}
    <div class="flex flex-col p-8 bg-card border border-border rounded-lg text-left">
      <span class="flex items-center justify-center w-10 h-10 mb-4 text-base font-bold text-accent-foreground bg-accent rounded-full">
        {{ .num }}
      </span>
      <h3 class="text-lg font-semibold text-foreground">{{ .title }}</h3>
      <p class="mt-3 text-sm sm:text-base md:text-lg lg:text-xl leading-6 md:leading-8 text-left text-muted-foreground">
        {{ .text }}
      </p>
    </div>
    {{ end }}
  </div>
</div>
