<!-- How It Works: 3-step participant journey -->
<div class="max-w-6xl mx-auto px-6 py-24 md:px-8">
  <h2 class="text-3xl font-semibold text-center text-gray-900 dark:text-gray-50">
    {{ .Site.Params.home.how_it_works.title }}
  </h2>

  <div class="grid gap-6 mt-12 md:grid-cols-3">
    {{ range .Site.Params.home.how_it_works.steps }}
    <div class="flex flex-col p-8 bg-white border border-slate-200 rounded-3xl shadow-sm">
      <span class="flex items-center justify-center w-10 h-10 mb-4 text-base font-bold text-white bg-primary-700 rounded-full">
        {{ .num }}
      </span>
      <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100">{{ .title }}</h3>
      <p class="mt-3 text-sm sm:text-base md:text-lg lg:text-xl leading-7 text-justify text-gray-700 dark:text-gray-300">
        {{ .text }}
      </p>
    </div>
    {{ end }}
  </div>
</div>
