<!-- Claim Your Report section -->
<div class="max-w-6xl mx-auto px-6 py-24 md:px-8">
  <div class="max-w-3xl mx-auto text-center">
    <h2 class="text-lg sm:text-xl md:text-2xl lg:text-3xl font-semibold text-gray-900 dark:text-gray-50">
      {{ .Site.Params.home.claim_report.title }}
    </h2>

    {{ range .Site.Params.home.claim_report.body }}
    <p class="mt-6 text-sm sm:text-base md:text-lg lg:text-xl leading-6 md:leading-8 text-justify text-gray-700 dark:text-gray-300">
      {{ .text }}
    </p>
    {{ end }}
  </div>

  <div class="max-w-3xl mx-auto mt-8 p-6 text-center bg-slate-50 border border-slate-200 rounded-3xl dark:bg-gray-800">
    <p class="text-sm sm:text-base md:text-lg lg:text-xl leading-6 md:leading-8 text-justify text-gray-700 dark:text-gray-300">
      {{ .Site.Params.home.claim_report.note }}
    </p>
  </div>
</div>
