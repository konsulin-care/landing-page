<!-- Meaning section: what #JadiTangguh does and does not mean -->
<div class="max-w-6xl mx-auto px-6 py-24 md:px-8">
  <div class="md:grid md:grid-cols-12 md:gap-12">
    <div class="md:col-span-4">
      {{ partial "section-kicker.html" (dict "label" .Site.Params.home.meaning.kicker "num" (page.Store.Get "sectionNum")) }}
      <h2 class="text-3xl font-semibold leading-tight text-foreground md:text-4xl">
        {{ .Site.Params.home.meaning.title }}
      </h2>
      <p class="mt-6 text-base leading-7 text-charcoal-700 md:text-lg md:leading-8">
        {{ .Site.Params.home.meaning.lead }}
      </p>
    </div>

    <div class="mt-12 md:col-span-8 md:mt-0">
      <ul class="grid gap-4 md:grid-cols-3">
        {{ range .Site.Params.home.meaning.cards }}
        <li class="rounded-lg border border-border bg-card p-6">
          <p class="text-sm leading-6 text-muted-foreground">{{ .muted }}</p>
          <p class="mt-2 text-base font-semibold text-foreground">{{ .strong }}</p>
        </li>
        {{ end }}
      </ul>
    </div>
  </div>
</div>
