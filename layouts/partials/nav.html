<div class="w-full bg-background text-foreground border-b border-border">
  <div x-data="{ open: false }" class="flex flex-col max-w-full px-4 mx-auto md:items-center md:justify-between md:flex-row md:px-6 lg:px-8">
    <div class="flex flex-row items-center justify-between p-4">
      <a href="/" class="flex items-center min-h-11 group">
        <img src="/images/site-logo.svg" class="h-9 w-9" alt="{{ .Site.Title }} Logo" />
        <div class="ml-3 text-xl font-black tracking-tight text-foreground">{{ .Site.Title }}</div>
      </a>
      <button class="inline-flex items-center justify-center min-h-11 min-w-11 rounded-lg md:hidden focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring" @click="open = !open" aria-expanded="false" :aria-expanded="open.toString()" aria-label="Menu" aria-controls="menuItems">
        <svg fill="currentColor" viewBox="0 0 20 20" class="w-6 h-6">
          <path x-show="!open" fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM9 15a1 1 0 011-1h6a1 1 0 110 2h-6a1 1 0 01-1-1z" clip-rule="evenodd"></path>
          <path x-show="open" fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
        </svg>
      </button>
    </div>
    <nav id="menuItems" :class="{'flex': open, 'hidden': !open}" class="flex-col flex-grow hidden pb-4 md:pb-0 md:flex md:justify-end md:flex-row md:items-center">
      {{ $page := . }}
      {{ range site.Menus.main }}
      {{ $current := or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }}
      <a
        class="inline-flex items-center min-h-11 px-4 text-sm rounded-lg hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring {{ if $current }}bg-accent text-accent-foreground font-bold underline{{ else }}font-semibold text-foreground{{ end }}"
        href="{{ .URL | absLangURL }}"
        {{ if $current }}aria-current="page"{{ end }}
        title="{{ .Title | default .Name }}"
      >{{ .Name }}</a>
      {{ end }}
      {{ if .Site.Params.auth }}
      <a href="{{ .Site.Params.auth }}" class="inline-flex items-center min-h-11 px-4 text-sm font-semibold rounded-lg bg-foreground text-background hover:bg-charcoal-700 md:ml-2">Login</a>
      {{ end }}
    </nav>
  </div>
</div>
