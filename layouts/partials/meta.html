<title itemprop="name">
  {{if .IsHome}} {{ $.Site.Params.meta_title }} {{else}} {{ .Title }} | {{ .Site.Title }} {{end}}
</title>

<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta name="keywords" content="{{ if .Keywords }}{{ delimit .Keywords ", " }}{{ else }}{{ delimit .Site.Params.keywords ", " }}{{ end }}">
<meta property="og:title" content="{{ .Title }} | {{ .Site.Title }}" />
<meta name="twitter:title" content="{{ .Title }} | {{ .Site.Title }}" />
<meta itemprop="name" content="{{ .Title }} | {{ .Site.Title }}" />
<meta name="application-name" content="{{ .Title }} | {{ .Site.Title }}" />
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
<meta property="og:site_name" content="{{ .Site.Title }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:locale" content="en" />
{{/* OG image: use Hugo image processing for WebP conversion */}}
{{ $ogImg := resources.Get "images/pages/positive-thinking-wide.png" }}
{{ $ogImgWebp := $ogImg.Resize "1200x630 webp q80" }}
<meta property="og:image" content="{{ $ogImgWebp.RelPermalink | absURL }}" />
<meta property="og:image:secure_url" content="{{ $ogImgWebp.RelPermalink | absURL }}" />
<meta property="og:type" content="{{if .IsHome}}website{{else}}article{{end}}" />
