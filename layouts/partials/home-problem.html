<!-- Problem section -->
<div class="max-w-screen-xl px-4 py-6 mx-auto sm:py-12">
  <div class="max-w-3xl mx-auto text-center">
    <h2 class="text-3xl font-bold tracking-tight text-primary-800 dark:text-primary-200 sm:text-4xl">
      {{ .Site.Params.home.problem.title }}
    </h2>
    {{ range .Site.Params.home.problem.copy }}
    <p class="mt-6 text-lg text-gray-900 dark:text-white">
      {{ .text }}
    </p>
    {{ end }}
  </div>

  <div class="grid gap-4 grid-cols-2 mt-8 lg:grid-cols-4">
    {{ range .Site.Params.home.problem.questions }}
    <div class="flex items-start p-6 bg-white border border-gray-200 rounded-xl shadow-sm dark:bg-gray-800 dark:border-gray-700">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mt-0.5 mr-3 text-primary-600 dark:text-primary-100 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p class="text-base font-medium text-gray-900 dark:text-gray-100">{{ . }}</p>
    </div>
    {{ end }}
  </div>

  <div class="mt-8 text-center">
    <a
      href="{{ .Site.Params.forward }}"
      class="inline-flex items-center justify-center px-6 py-3 text-base font-semibold text-white bg-primary-600 border border-transparent rounded-md shadow hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-primary-500"
    >
      {{ .Site.Params.home.problem.micro_cta }}
    </a>
  </div>
</div>
