<!-- Process section -->
<div class="max-w-screen-xl px-4 py-6 mx-auto sm:py-12">
  <div class="max-w-3xl mx-auto text-center">
    <h2 class="text-3xl font-bold tracking-tight text-primary-800 dark:text-primary-200 sm:text-4xl">
      {{ .Site.Params.home.process.title }}
    </h2>
  </div>

  <div class="grid gap-4 grid-cols-2 mt-8 lg:grid-cols-4">
    {{ range .Site.Params.home.process.steps }}
    <div class="relative p-6 bg-white border border-gray-200 rounded-xl shadow-sm dark:bg-gray-800 dark:border-gray-700">
      <span class="inline-flex items-center justify-center w-10 h-10 mb-2 text-lg font-bold text-white bg-primary-600 rounded-full">
        {{ .num }}
      </span>
      <h3 class="text-xl font-bold text-gray-900 dark:text-gray-100">{{ .title }}</h3>
      <p class="mt-2 text-base text-gray-700 dark:text-gray-300">{{ .text }}</p>
    </div>
    {{ end }}
  </div>

  <div class="mt-8 text-center">
    <a
      href="{{ .Site.Params.forward }}"
      class="inline-flex items-center justify-center px-6 py-3 text-base font-semibold text-white bg-primary-600 border border-transparent rounded-md shadow hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-primary-500"
    >
      {{ .Site.Params.home.process.cta }}
    </a>
  </div>
</div>
