<!-- Final CTA section: single conversion action -->

    <h2 class="text-3xl font-semibold text-foreground md:text-4xl">
      {{ .Site.Params.home.final_cta.headline }}
    </h2>
    <p class="mt-6 text-sm sm:text-base md:text-lg lg:text-xl leading-6 md:leading-8 text-muted-foreground">

    <div class="mt-10">
