<!-- Final CTA section -->
<div class="relative pb-16 mt-6">
  <div class="max-w-md mx-auto px-7 sm:max-w-3xl lg:max-w-7xl">
    <div class="relative px-6 py-10 overflow-hidden shadow-xl bg-primary-500 rounded-2xl sm:px-12 sm:py-20">
      <div aria-hidden="true" class="absolute inset-0 -mt-72 sm:-mt-32 md:mt-0">
        <svg class="absolute inset-0 w-full h-full" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 1463 360" loading="lazy">
          <path class="text-primary-600 text-opacity-40" fill="currentColor" d="M-82.673 72l1761.849 472.086-134.327 501.315-1761.85-472.086z" />
          <path class="text-primary-600 text-opacity-40" fill="currentColor" d="M-217.088 544.086L1544.761 72l134.327 501.316-1761.849 472.086z" />
        </svg>
      </div>
      <div class="relative">
        <div class="sm:text-center">
          <h2 class="text-3xl font-bold tracking-tight text-gray-900 sm:text-4xl">
            {{ .Site.Params.home.cta_section.title }}
          </h2>
          <p class="max-w-2xl mx-auto mt-6 text-lg text-gray-700">
            {{ .Site.Params.home.cta_section.subtitle }}
          </p>
        </div>
        <div class="flex flex-col gap-4 mt-10 sm:flex-row sm:justify-center sm:items-center">
          <a
            href="{{ .Site.Params.forward }}"
            class="inline-flex items-center justify-center px-8 py-4 text-base font-semibold text-gray-900 bg-white border border-transparent rounded-md shadow hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-primary-500"
          >
            {{ .Site.Params.home.cta_section.primary_cta }}
          </a>
          <button
            type="button"
            @click="scrollToSection(4)"
            class="inline-flex items-center justify-center px-6 py-4 text-base font-medium text-gray-900 border border-gray-900 rounded-md shadow-sm hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-primary-500"
          >
            {{ .Site.Params.home.cta_section.secondary_cta }} &rarr;
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
