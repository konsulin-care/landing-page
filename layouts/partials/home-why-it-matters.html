<!-- Why This Research Matters section -->
<div class="max-w-6xl mx-auto px-6 py-24 md:px-8">
  <div class="grid gap-10 md:grid-cols-2 md:items-center">
    <div class="order-2 md:order-1">
      <h2 class="text-3xl font-semibold text-gray-900 dark:text-gray-50">
        {{ .Site.Params.home.why_it_matters.title }}
      </h2>
      <p class="mt-6 text-lg leading-8 text-gray-700 dark:text-gray-300">
        {{ .Site.Params.home.why_it_matters.body }}
      </p>
      <a
        href="{{ .Site.Params.forward }}"
        class="inline-flex items-center justify-center px-8 py-4 mt-8 text-base font-semibold text-white rounded-3xl bg-primary-700 shadow-sm hover:bg-primary-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2"
      >
        {{ .Site.Params.home.why_it_matters.cta }}
      </a>
    </div>

    <div class="order-1 md:order-2">
      {{ $img := resources.Get "images/why-it-matters.jpg" }}
      {{ with $img }}
      {{ $webp := .Resize "800x webp q80" }}
      <img
        src="{{ $webp.RelPermalink }}"
        alt="Ilustrasi pentingnya penelitian kesehatan mental"
        width="{{ $webp.Width }}"
        height="{{ $webp.Height }}"
        loading="lazy"
        class="rounded-3xl object-cover w-full"
      />
      {{ end }}
    </div>
  </div>
</div>
