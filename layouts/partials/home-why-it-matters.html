<!-- Why This Research Matters section -->
<div class="max-w-6xl mx-auto px-6 py-24 md:px-8">
  <div class="grid gap-10 md:grid-cols-2 md:items-center">
    <div class="order-2 md:order-2 text-left">
      <h2 class="text-lg sm:text-xl md:text-2xl lg:text-3xl font-semibold text-foreground">
        {{ .Site.Params.home.why_it_matters.title }}
      </h2>
      <p class="mt-6 text-sm sm:text-base md:text-lg lg:text-xl leading-6 md:leading-8 text-muted-foreground">
        {{ .Site.Params.home.why_it_matters.body }}
      </p>
      <a
        href="{{ .Site.Params.forward }}"
        class="inline-flex items-center justify-center px-8 py-4 mt-8 text-base font-semibold text-background rounded-lg bg-foreground hover:bg-charcoal-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
      >
        {{ .Site.Params.home.why_it_matters.cta }}
      </a>
    </div>

    <div class="order-1 md:order-1">
      {{ $img := resources.Get "images/why-it-matters.jpg" }}
      {{ with $img }}
      {{ $webp := .Resize "800x webp q80" }}
      <img
        src="{{ $webp.RelPermalink }}"
        alt="Ilustrasi pentingnya penelitian kesehatan mental"
        width="{{ $webp.Width }}"
        height="{{ $webp.Height }}"
        loading="lazy"
        decoding="async"
        class="rounded-lg object-cover w-full"
      />
      {{ end }}
    </div>
  </div>
</div>
