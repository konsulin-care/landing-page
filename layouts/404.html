{{ define "main"}}
<main id="main">
    <div class="max-w-screen-xl px-4 py-8 mx-auto lg:py-16 lg:px-6">
        <div class="max-w-screen-sm mx-auto text-center bg-card border border-border rounded-lg p-8">
            <h1 class="mb-4 font-black tracking-tight text-8xl text-foreground">404</h1>
            <p class="mb-4 text-3xl font-bold tracking-tight text-foreground">
                Halaman tidak ditemukan.
            </p>
            <p class="mb-4 text-lg text-muted-foreground">Maaf, halaman yang Anda cari tidak ada. Silakan kembali ke beranda.</p>
            <div class="my-4">
                {{ partial "button.html" (dict "href" "/" "label" "Kembali ke Beranda") }}
            </div>
        </div>
    </div>
</main>
{{ end }}
