{{define "main"}}
<article>
  {{ partial "page-header.html" (dict "title" .Title) }}
  <div class="max-w-2xl px-6 pt-8 pb-16 mx-auto">
    {{ if .Params.summary }}
    <div class="mb-8">{{ partial "summary-card.html" (dict "page" . "variant" "blog") }}</div>
    {{ end }}
    <div class="prose prose-neutral">
      {{ .Content }}
    </div>
  </div>
</article>
{{end}}
