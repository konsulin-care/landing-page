{{ define "main" }}
<main class="scroll-snap-container">

  {{ $sections := slice
    (dict "num" 1 "tone" "paper" "id" "hero" "partial" "home-hero.html" "context" .)
    (dict "num" 9 "tone" "charcoal" "id" "final-cta" "partial" "home-final-cta.html" "context" .)
  }}

  {{ range $sections }}
    {{ partial "scroll-section.html" . }}
  {{ end }}

</main>

<script>
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const hero = document.getElementById('hero');
    const nextSection = hero?.nextElementSibling;
    if (nextSection) {
      nextSection.scrollIntoView({ behavior: 'smooth' });
    }
  }
});
</script>

{{ end }}
