{{ define "main" }}
<main
  x-data="{
    currentSection: 1,
    totalSections: 5,
    headerHeight: 64,
    clickedBtn: null,
    init() {
      // Use IntersectionObserver to detect current section
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const sectionNum = parseInt(entry.target.id.replace('section-', ''));
              this.currentSection = sectionNum;
            }
          });
        },
        {
          root: null,
          rootMargin: '-50% 0px -50% 0px', // Trigger when section is in middle of viewport
          threshold: 0
        }
      );
      
      document.querySelectorAll('.scroll-snap-section').forEach(section => {
        observer.observe(section);
      });
    },
    scrollToSection(sectionNum) {
      this.clickedBtn = sectionNum;
      const section = document.getElementById('section-' + sectionNum);
      if (section) {
        section.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
        this.currentSection = sectionNum;
      }
      setTimeout(() => {
        this.clickedBtn = null;
      }, 300);
    },
    handleKeydown(e) {
      if (e.key === 'ArrowDown' || e.key === 'PageDown') {
        e.preventDefault();
        if (this.currentSection < this.totalSections) {
          this.scrollToSection(this.currentSection + 1);
        }
      } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault();
        if (this.currentSection > 1) {
          this.scrollToSection(this.currentSection - 1);
        }
      }
    }
  }"
  x-init="init();"
  @keydown.window="handleKeydown($event)"
>

  <link rel="stylesheet" href="{{ "css/carousel.css" | relURL }}">
  <script src="{{ "js/carousel.js" | relURL }}"></script>

  <!-- Section 1: Header -->
  <section id="section-1" class="scroll-snap-section relative bg-gray-200 dark:bg-gray-900">
    <div class="scroll-snap-section__content">
      {{ partial "home-header.html" . }}
    </div>
    
    <!-- Scroll indicator: Lanjut (down) at bottom - leads to next section -->
    <div class="scroll-indicator fixed bottom-8 left-1/2 transform -translate-x-1/2 z-50">
      <button 
        @click="scrollToSection(2)"
        class="group flex items-center justify-center w-10 h-10 rounded-full transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 bg-transparent"
        :class="clickedBtn === 2 ? 'bg-secondary-600' : (currentSection === 1 ? 'bg-primary-600' : '')"
        aria-label="Scroll to next section"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-6 h-6 transition-colors duration-200"
          :class="(clickedBtn === 2 || currentSection === 1) ? 'text-white' : 'group-hover:text-white'"
          :style="(clickedBtn === 2 || currentSection === 1) ? '' : 'color: #0abdc3;'"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>
  </section>

  <!-- Section 2: Vision and mission -->
  <section id="section-2" class="scroll-snap-section relative">
    <div class="scroll-snap-section__content">
      {{ partial "home-vision-mission.html" . }}
    </div>
    
    <!-- Scroll indicator: Previously (up) at top - goes back -->
    <div class="scroll-indicator fixed top-8 left-1/2 transform -translate-x-1/2 z-50">
      <button 
        @click="scrollToSection(1)"
        class="group flex items-center justify-center w-10 h-10 rounded-full transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 bg-transparent"
        :class="clickedBtn === 1 ? 'bg-secondary-600' : (currentSection === 1 ? 'bg-primary-600' : '')"
        aria-label="Scroll to previous section"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-6 h-6 transition-colors duration-200"
          :class="(clickedBtn === 1 || currentSection === 1) ? 'text-white' : 'group-hover:text-white'"
          :style="(clickedBtn === 1 || currentSection === 1) ? '' : 'color: #0abdc3;'"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
        </svg>
      </button>
    </div>
    
    <!-- Scroll indicator: Lanjut (down) at bottom - goes forward -->
    <div class="scroll-indicator fixed bottom-8 left-1/2 transform -translate-x-1/2 z-50">
      <button 
        @click="scrollToSection(3)"
        class="group flex items-center justify-center w-10 h-10 rounded-full transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 bg-transparent"
        :class="clickedBtn === 3 ? 'bg-secondary-600' : (currentSection === 2 ? 'bg-primary-600' : '')"

      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-6 h-6 transition-colors duration-200"

          :style="(clickedBtn === 3 || currentSection === 2) ? '' : 'color: #0abdc3;'"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>
  </section>

        >

    </div>
    
    <!-- Scroll indicator: Lanjut (down) at bottom -->

          :class="(clickedBtn === 4 || currentSection === 3) ? 'text-white' : 'group-hover:text-white'"
          :style="(clickedBtn === 4 || currentSection === 3) ? '' : 'color: #0abdc3;'"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>
  </section>

  <!-- Section 4: Partners -->
  <section id="section-4" class="scroll-snap-section relative">
    <div class="scroll-snap-section__content">
      {{ partial "home-partners.html" . }}
    </div>
    
    <!-- Scroll indicator: Previously (up) at top -->
    <div class="scroll-indicator fixed top-8 left-1/2 transform -translate-x-1/2 z-50">
      <button 
        @click="scrollToSection(3)"
        class="group flex items-center justify-center w-10 h-10 rounded-full transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 bg-transparent"
        :class="clickedBtn === 3 ? 'bg-secondary-600' : (currentSection === 3 ? 'bg-primary-600' : '')"

      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-6 h-6 transition-colors duration-200"

          :style="(clickedBtn === 3 || currentSection === 3) ? '' : 'color: #0abdc3;'"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
        </svg>

    </div>
    
    <!-- Scroll indicator: Lanjut (down) at bottom -->
    <div class="scroll-indicator fixed bottom-8 left-1/2 transform -translate-x-1/2 z-50">
      <button 
        @click="scrollToSection(5)"
        class="group flex items-center justify-center w-10 h-10 rounded-full transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 bg-transparent"
        :class="clickedBtn === 5 ? 'bg-secondary-600' : (currentSection === 4 ? 'bg-primary-600' : '')"

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-6 h-6 transition-colors duration-200"

  <!-- Section 5: CTA -->
  <section id="section-5" class="scroll-snap-section relative">
    <div class="scroll-snap-section__content">
      {{ if not .Site.Params.Disable_stay_uptodate}}
      {{ partial "home-cta.html" . }}

    <!-- Scroll indicator: Previously (up) at top - goes back to previous section -->
    <div class="scroll-indicator fixed top-8 left-1/2 transform -translate-x-1/2 z-50">
      <button 
        @click="scrollToSection(4)"
