{{ define "main" }}
<main
  x-data="{
    currentSection: 1,
    totalSections: 5,
    headerHeight: 64,
    init() {
      // Use IntersectionObserver to detect current section
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const sectionNum = parseInt(entry.target.id.replace('section-', ''));
              this.currentSection = sectionNum;
            }
          });
        },
        {
          root: null,
          rootMargin: '-50% 0px -50% 0px', // Trigger when section is in middle of viewport
          threshold: 0
        }
      );
      
      document.querySelectorAll('.scroll-snap-section').forEach(section => {
        observer.observe(section);
      });
    },
    scrollToSection(sectionNum) {
      const section = document.getElementById('section-' + sectionNum);
      if (section) {
        section.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
        this.currentSection = sectionNum;
      }
    },
    handleKeydown(e) {
      if (e.key === 'ArrowDown' || e.key === 'PageDown') {
        e.preventDefault();
        if (this.currentSection < this.totalSections) {
          this.scrollToSection(this.currentSection + 1);
        }
      } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault();
        if (this.currentSection > 1) {
          this.scrollToSection(this.currentSection - 1);
        }
      }
    }
  }"
  x-init="init();"
  @keydown.window="handleKeydown($event)"
>

  <link rel="stylesheet" href="{{ "css/carousel.css" | relURL }}">
  <script src="{{ "js/carousel.js" | relURL }}"></script>

  <!-- Section 1: Header -->
  <section id="section-1" class="scroll-snap-section relative bg-gray-200 dark:bg-gray-900">
    <div class="scroll-snap-section__content">
      {{ partial "home-header.html" . }}
    </div>
    
    <!-- Scroll indicator: Lanjut (down) at bottom - leads to next section -->
    <div class="scroll-indicator fixed bottom-8 left-1/2 transform -translate-x-1/2 z-50">
      <button 
        @click="scrollToSection(2)"
        class="flex flex-col items-center text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100 transition-colors duration-300"
        aria-label="Scroll to next section"
      >
        <span class="text-sm mb-2">Lanjut</span>
        <svg class="w-6 h-6 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
        </svg>
      </button>
    </div>
  </section>

  <!-- Section 2: Vision and mission -->
  <section id="section-2" class="scroll-snap-section relative">
    <div class="scroll-snap-section__content">
      {{ partial "home-vision-mission.html" . }}
    </div>
    
    <!-- Scroll indicator: Previously (up) at top - goes back -->
    <div class="scroll-indicator fixed top-8 left-1/2 transform -translate-x-1/2 z-50">

        @click="scrollToSection(1)"
        class="flex flex-col items-center text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100 transition-colors duration-300"
        aria-label="Scroll to previous section"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
        </svg>
        <span class="text-sm mt-2">Sebelumnya</span>
      </button>
    </div>
    
    <!-- Scroll indicator: Lanjut (down) at bottom - goes forward -->
