baseURL: 'https://konsulin.care/'
csURL: 'https://cs.konsulin.care'
title: Konsulin
languageCode: en-us
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
canonifyURLs: true
pagination:
  pagerSize: 3
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

security:
  node:
    permissions:
      # Tailwind v4 runs through @tailwindcss/postcss; Hugo's node wrapper
      # blocks these APIs unless postcss is allow-listed (defaults cover
      # only the tailwindcss binary).
      allowAddons:
        - postcss
        - tailwindcss
      allowWorker:
        - postcss
        - tailwindcss
      allowChildProcess:
        - postcss
        - tailwindcss

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: PT TEMAN KONSULIN SEJAWAT
  authorimage: ../assets/images/global/author.svg
  chatwoot_url: "{chatwoot_url}"
  chatwoot_token: "{chatwoot_token}"
  og_image: /images/positive-thinking-wide.png
  # Browser/meta alias for the homepage, distinct from the short title.
  meta_title: "Konsulin | Riset Kesehatan Bersama Masyarakat"
  description: "Pengalaman kita membantu ribuan orang merasa dipahami"
  forward: "https://app.konsulin.care/research"
  # Nav login button: auth entry that returns the user to the research page.
  auth: "https://app.konsulin.care/auth?redirectToPath=/research"
  disable_theme_toggle: false
  keywords:
    - riset kesehatan partisipatif
    - riset kesehatan bersama masyarakat
    - citizen science
    - kesehatan mental
    - aplikasi kesehatan jiwa
    - dokter psikolog
    - dokter psikiater
    - psikiater
    - psikiatri
    - psikolog online
    - konsultasi psikolog online
    - kesehatan mental
    - tes kesehatan mental
    - tes kejiwaan online
    - tes depresi online
    - tes kecemasan
    - tes kesehatan mental online gratis

  home:
    hero:
      headline: "Pengalaman kita membantu ribuan orang merasa dipahami"
      body:
        - text: "Kelelahan emosional sering menjadi bagian dari keseharian kita. Dengan saling berbagi pengalaman, kita bisa memahami bagaimana burnout dialami oleh orang-orang di sekitar kita."
      primary_cta: "Mulai Survei (10 Menit)"
      trust:
        - "Privasi terjaga"
        - "Untuk penelitian"
        - "Laporan hasil langsung tersedia"
    why_it_matters:
      title: "Kenapa penelitian ini penting?"
      body: "Banyak pengalaman sehari hari tentang kesehatan mental belum cukup terwakili dalam penelitian. Ketika ribuan pengalaman dikumpulkan melalui platform ini, peneliti dapat menemukan pola yang membantu mengembangkan layanan yang lebih tepat bagi masyarakat Indonesia."
      cta: "Mulai Survei"
    how_it_works:
      title: "Cara kerjanya"
      steps:
        - num: "1"
          title: "Isi Survei"
          text: "Jawab pertanyaan tentang apa yang sehari-hari Anda rasakan. Tidak ada jawaban benar atau salah, Anda cukup menanggapi sesuai dengan apa yang Anda alami."
        - num: "2"
          title: "Dapatkan ID Anonim"
          text: "Begitu selesai, sistem otomatis membuat ID Anonim. Identitas ini memungkinkan partisipasi penelitian tetap terlindungi tanpa menggunakan nama Anda."
        - num: "3"
          title: "Lihat Laporan Anda"
          text: "Laporan ringkas langsung tersedia setelah survei selesai. Jika nanti ingin menyimpannya, Anda bisa mengklaim laporan menggunakan email melalui magic link."
    claim_report:
      title: "Laporan Anda langsung tersedia"
      subtitle: "Setelah menyelesaikan survei, Anda langsung mendapatkan laporan. Jika ingin menyimpannya untuk nanti, Anda bisa mengklaimnya kapan saja."
      cards:
        - icon: "fingerprint-pattern"
          title: "ID Anonim dibuat otomatis"
          text: "Setiap partisipasi mendapat ID Anonim sehingga laporan bisa dibuat tanpa menggunakan nama Anda."
        - icon: "mail-badge"
          title: "Klaim dengan magic link"
          text: "Cukup masukkan email jika ingin menyimpan laporan. Kami mengirimkan tautan masuk tanpa password."
        - icon: "scroll-text"
          title: "Riwayat tersimpan"
          text: "Partisipasi berikutnya akan tersimpan di tempat yang sama sehingga Anda dapat melihat perkembangan dari waktu ke waktu."
      note:
        title: "Email bersifat opsional"
        text: "Anda tetap dapat melihat laporan segera setelah survei selesai hingga 24 jam. Email hanya diperlukan jika ingin menyimpannya ke akun."
    research_credibility:
      title: "Dibangun untuk penelitian kesehatan"
      cards:
        - title: "Pemrosesan ID Anonim"
          text: "Sistem menggunakan ID Anonim agar partisipasi penelitian tidak bergantung pada nama atau identitas pribadi."
        - title: "Dirancang untuk Penelitian"
          text: "Platform dibuat khusus untuk mendukung pengumpulan data penelitian secara konsisten."
        - title: "Akses Kembali Laporan"
          text: "Klaim laporan kapan saja menggunakan magic link tanpa mengubah partisipasi Anda."
      cta: "Mulai Survei"
    final_cta:
      headline: "Sepuluh menit Anda berharga"
      body: "Dalam sepuluh menit, Anda dapat membantu pengembangan program kesehatan yang lebih baik. Mulai dari satu partisipasi, dan simpan laporan Anda. Bangun riwayat partisipasi penelitian secara bertahap."
      cta: "Mulai Survei Sekarang"

  social_media:
    github:
      enabled: true
      url: 'https://github.com/konsulin-care'
    facebook:
      enabled: true
      url: 'https://facebook.com/konsulin.care'
    instagram:
      enabled: true
      url: 'https://instagram.com/konsulin.care'
    twitter:
      enabled: true
      url: 'https://x.com/KonsulinCare'

menu:
  main:
    - identifier: feature
      name: Feature
      url: /feature/
      weight: 1
    - identifier: pricing
      name: Pricing
      url: /pricing/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: blog
      name: Blogs
      url: /blog/
      weight: 20
  footer:
    - identifier: feature
      name: Feature
      url: /feature/
      weight: 1
    - identifier: pricing
      name: Pricing
      url: /pricing/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 50

taxonomies:
  category: Categories
  tag: Tags

privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false
  instagram:
    disable: false
    simple: false
  twitter:
    disable: false
    enableDNT: false
    simple: false
  vimeo:
    disable: false
    enableDNT: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true

module:
  hugoVersion:
    extended: true
    min: "0.104.0"

ignoreFiles:
  - "AGENTS.md"
  - "layouts/AGENTS.md"
  - "layouts/partials/AGENTS.md"
  - "docs/*.md"
