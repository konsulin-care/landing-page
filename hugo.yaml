baseURL: 'https://konsulin.care/'
csURL: 'https://cs.konsulin.care'
title: Konsulin
locale: id-ID
DefaultContentLanguage: id
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
canonifyURLs: true
pagination:
  pagerSize: 3
enableInlineShortcodes: true

security:
  node:
    permissions:
      # Tailwind v4 runs through @tailwindcss/postcss; Hugo's node wrapper
      # blocks these APIs unless postcss is allow-listed (defaults cover
      # only the tailwindcss binary).
      allowAddons:
        - postcss
        - tailwindcss
      allowWorker:
        - postcss
        - tailwindcss
      allowChildProcess:
        - postcss
        - tailwindcss

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: PT TEMAN KONSULIN SEJAWAT
  authorimage: ../assets/images/global/author.svg
  chatwoot_url: "{chatwoot_url}"
  chatwoot_token: "{chatwoot_token}"

  # Browser/meta alias for the homepage, distinct from the short title.
  meta_title: "Konsulin | Bareng Warga, Saling Jaga"
  description: "#JadiTangguh adalah gerakan riset warga tentang resiliensi psikologis dan kesehatan mental. Ikut survei 10 menit, gratis, dan bantu kita saling memahami."
  forward: "https://app.konsulin.care/research"
  # Nav login button: auth entry that returns the user to the research page.
  auth: "https://app.konsulin.care/auth?redirectToPath=/research"
  hashtag_url: 'https://instagram.com/konsulin.care'
  keywords:
    - riset kesehatan partisipatif
    - riset kesehatan bersama masyarakat
    - citizen science
    - kesehatan mental
    - resiliensi
    - ketangguhan psikologis
    - JadiTangguh
    - tes kesehatan mental
    - tes kejiwaan online
    - tes depresi online
    - tes kecemasan
    - tes kesehatan mental online gratis

  home:
    hero:
      hashtag: "#JadiTangguh"
      lines:
        - "bukan berarti nggak pernah rapuh."
        - "bukan berarti harus menghadapi semuanya sendiri."
        - "artinya belajar beradaptasi, sedikit demi sedikit."
      glosses:
        - word: "rapuh"
          text: "Wajar merasa rapuh. Mengenali apa yang Anda alami adalah bagian dari prosesnya."
          href: "/faq/#bantuan"
        - word: "sendiri"
          text: "Mencari dan menerima dukungan juga bagian dari resiliensi."
          link_label: "Baca makna tangguh ↓"
          href: "#makna-tangguh"
        - word: "beradaptasi"
          text: "Dalam riset, ini disebut resiliensi psikologis: proses belajar menghadapi kesulitan, pelan-pelan."
          link_label: "Baca makna tangguh ↓"
          href: "#makna-tangguh"
      body:
        - text: "Gerakan riset warga untuk memahami kesehatan mental bersama-sama."
      primary_cta: "Mulai Survei (10 Menit)"
      trust:
        - "Bukan diagnosis, tidak ada jawaban salah"
        - "Hasil riset dibagikan kembali untuk publik"
        - "Sepuluh menit, boleh berhenti kapan saja"
      steps:
        - "Isi survei"
        - "Dapat ID Anonim"
        - "Lihat laporan"
    recognition:
      kicker: "Kenali tandanya"
      title: "Stres jarang datang dengan nama"
      lead: "Banyak dari kita nggak menyebutnya masalah kesehatan mental. Kita menyebutnya hari yang panjang, atau sekadar capek."
      signals:
        - label: "Tubuh"
          text: "Perut mulas setiap menjelang *deadline*."
        - label: "Tidur"
          text: "Bangun tidur masih terasa kurang istirahat."
        - label: "Pikiran"
          text: "Banyak *pikiran*, bahkan saat mau istirahat."
        - label: "Uang"
          text: "Cemas tiap cek saldo di akhir bulan."
        - label: "Hubungan"
          text: "Mudah marah dengan orang terdekat, lalu menyesal."
        - label: "Diam"
          text: 'Bilang "nggak apa-apa", padahal ada yang nggak beres.'
      note: "Ini bukan daftar untuk mendiagnosis diri, dan mengenali satu tanda bukan berarti Anda punya kondisi tertentu. Ini cara untuk saling memahami."
      closing: "Kalau Anda mengenali salah satunya, itu wajar, dan Anda nggak sendirian. #JadiTangguh berarti memahami kapan perlu mencari dukungan."
      help_label: "Kalau terasa berat sekarang, lihat bantuan"
    meaning:
      kicker: "Makna tangguh"
      title: "Tangguh bukan berarti kuat terus"
      lead: "Tangguh adalah nama gerakan kita. Dalam penelitian, kita menyebutnya resiliensi psikologis, yaitu proses belajar beradaptasi, menemukan cara menghadapi kesulitan, dan mengembangkan sumber daya yang membantu kita menjaga atau memulihkan kesehatan mental. Mencari dan menerima dukungan juga bagian dari proses itu."
      cards:
        - muted: "Bukan pura-pura baik-baik saja"
          strong: "Tapi mengenali apa yang kita alami"
        - muted: "Bukan menahan-nahan perasaan"
          strong: "Tapi mencari cara yang cocok, termasuk berhenti sebentar"
        - muted: "Bukan menghadapi semuanya sendiri"
          strong: "Tapi mencari dan menerima dukungan"
    why_record:
      kicker: "Kenapa dicatat"
      title: "Yang nggak dicatat, nggak terlihat"
      lead: "Kebijakan yang baik butuh data yang baik. Untuk memahami pengalaman yang benar-benar kita jalani, peneliti perlu mendengarnya langsung dari kita."
      quote: "Satu kali pengisian ibarat satu foto yang menangkap satu momen. Pengisian berulang membantu peneliti memahami perubahan, cara kita beradaptasi, dan hal-hal yang mendukung kesehatan mental dari waktu ke waktu. Ikut satu kali pun tetap berharga."
      closing: "Ini riset oleh warga. Pengalaman dikumpulkan dari publik, dan hasilnya dibagikan kembali untuk publik."
    if_join:
      kicker: "Kalau Anda ikut"
      title: "Sepuluh menit, tanpa nama"
      steps:
        - title: "Isi Survei."
          text: "Jawab pertanyaan tentang apa yang sehari-hari Anda rasakan. Tidak ada jawaban benar atau salah."
        - title: "Dapatkan ID Anonim."
          text: "Begitu selesai, sistem otomatis membuat ID Anonim, jadi Anda tidak perlu mengisi nama. Peneliti hanya melihat ID acak, bukan identitas Anda."
        - title: "Lihat Laporan Anda."
          text: "Laporan ringkas langsung tersedia. Email hanya diperlukan jika Anda ingin menyimpannya, dan peneliti tidak bisa melihat email Anda. Laporan tanpa email hanya bisa disimpan dalam 24 jam."
      assurances:
        - "Gratis"
        - "Boleh berhenti kapan saja"
        - "Data tidak dijual"
        - "Bukan diagnosis"
      link_label: "Baca detail studi dan cara data dikelola"
    final_cta:
      kicker: "Ikut serta"
      headline: "Jaga diri. Jaga sesama. Mulai dari sini."
      body: "Sepuluh menit dari Anda bisa membantu kita memahami resiliensi dan kesehatan mental bersama-sama. Sekecil apa pun, itu berarti."
      cta: "Mulai Survei (10 Menit)"
      faq_label: "Masih ada pertanyaan? Baca FAQ."

  social_media:
    github:
      enabled: true
      url: 'https://github.com/konsulin-care'
    facebook:
      enabled: true
      url: 'https://facebook.com/konsulin.care'
    instagram:
      enabled: true
      url: 'https://instagram.com/konsulin.care'
    twitter:
      enabled: true
      url: 'https://x.com/KonsulinCare'

