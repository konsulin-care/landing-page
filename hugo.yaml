baseURL: 'https://konsulin.care/'
csURL: 'https://cs.konsulin.care'
title: Konsulin
locale: id-ID
DefaultContentLanguage: id
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
canonifyURLs: true
pagination:
  pagerSize: 3
enableInlineShortcodes: true

security:
  node:
    permissions:
      # Tailwind v4 runs through @tailwindcss/postcss; Hugo's node wrapper
      # blocks these APIs unless postcss is allow-listed (defaults cover
      # only the tailwindcss binary).
      allowAddons:
        - postcss
        - tailwindcss
      allowWorker:
        - postcss
        - tailwindcss
      allowChildProcess:
        - postcss
        - tailwindcss

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: PT TEMAN KONSULIN SEJAWAT
  authorimage: ../assets/images/global/author.svg
  chatwoot_url: "{chatwoot_url}"
  chatwoot_token: "{chatwoot_token}"

  # Browser/meta alias for the homepage, distinct from the short title.
  meta_title: "Konsulin | Bareng Warga, Saling Jaga"
  description: "#JadiTangguh adalah gerakan riset warga tentang resiliensi psikologis dan kesehatan mental. Ikut survei 10 menit, gratis, dan bantu kita saling memahami."
  forward: "https://app.konsulin.care/research"
  # Nav login button: auth entry that returns the user to the research page.
  auth: "https://app.konsulin.care/auth?redirectToPath=/research"
  hashtag_url: 'https://instagram.com/konsulin.care'
  keywords:
    - riset kesehatan partisipatif
    - riset kesehatan bersama masyarakat
    - citizen science
    - kesehatan mental
    - resiliensi
    - ketangguhan psikologis
    - JadiTangguh
    - tes kesehatan mental
    - tes kejiwaan online
    - tes depresi online
    - tes kecemasan
    - tes kesehatan mental online gratis

  home:
    hero:
      hashtag: "#JadiTangguh"
      rotation_ms: 3000
      stage_ms: [3000, 6000, 6000]
      lines:
        - "bukan berarti nggak pernah rapuh."
        - "bukan berarti harus menghadapi semuanya sendiri."
        - "artinya belajar beradaptasi, sedikit demi sedikit."
      glosses:
        - word: "rapuh"
          text: "Wajar merasa rapuh. Mengenali apa yang Anda alami adalah bagian dari prosesnya."
          href: "/faq/#bantuan"
        - word: "sendiri"
          text: "Mencari dan menerima dukungan juga bagian dari resiliensi."
          link_label: "Baca makna tangguh ↓"
          href: "#makna-tangguh"
        - word: "beradaptasi"
          text: "Dalam riset, ini disebut resiliensi psikologis: proses belajar menghadapi kesulitan, pelan-pelan."
          link_label: "Baca makna tangguh ↓"
          href: "#makna-tangguh"
      body:
        - text: "Gerakan riset warga untuk memahami kesehatan mental bersama-sama."
      primary_cta: "Mulai Survei (10 Menit)"
      trust:
        - "Sepuluh menit, boleh berhenti kapan saja"
        - "Hasil riset dibagikan kembali untuk publik"
        - "Bukan diagnosis, tidak ada jawaban salah"
      steps:
        - "Isi survei"
        - "Dapat ID Anonim"
        - "Lihat laporan"
      demo:
        label: "Contoh alur survei"
        note: "Contoh saja. Jawaban di sini tidak disimpan."
        badge: "Contoh"
        question:
          kicker: "Contoh pertanyaan"
          instruction: "Selama 2 minggu terakhir, seberapa sering Anda terganggu oleh masalah-masalah berikut?"
          item: "Merasa gugup, cemas, atau gelisah"
          options:
            - "Tidak pernah"
            - "Beberapa hari"
            - "Lebih dari separuh waktu yang dimaksud"
            - "Hampir setiap hari"
        id:
          label: "ID Anonim Anda"
          prefix: "JT-"
          length: 10
          count: 5
          text: "Jawaban Anda bergabung dengan jawaban warga lain, tanpa nama."
        report:
          title: "Laporan Anda"
          badge: "Baseline"
          bars:
            - label: "Kecemasan"
              value: 40
            - label: "Resiliensi"
              value: 65
          timeline_label: "Cek ulang berkala"
          timeline:
            - "Baseline"
            - "Cek ulang 1"
            - "Cek ulang 2"
          retake: "Simpan hasil hari ini ke akun Anda, lalu ikut lagi saat cek ulang berikutnya."
          save_label: "Simpan hasil"
          saved_label: "Tersimpan"
    recognition:
      kicker: "Kenali tandanya"
      title: "Stres jarang datang dengan nama"
      lead: "Banyak dari kita nggak menyebutnya masalah kesehatan mental. Kita menyebutnya hari yang panjang, atau sekadar capek."
      prompt: "Yang mana yang terasa akrab?"
      prompt_hint: "Ketuk yang cocok."
      signals:
        - label: "Tubuh"
          icon: "person-standing"
          text: "Perut mulas setiap menjelang *deadline*."
        - label: "Tidur"
          icon: "bed"
          text: "Bangun tidur masih terasa kurang istirahat."
        - label: "Pikiran"
          icon: "brain"
          text: "Banyak *pikiran*, bahkan saat mau istirahat."
        - label: "Uang"
          icon: "wallet"
          text: "Cemas tiap cek saldo di akhir bulan."
        - label: "Hubungan"
          icon: "users"
          text: "Mudah marah dengan orang terdekat, lalu menyesal."
        - label: "Diam"
          icon: "message-circle-off"
          text: 'Bilang "nggak apa-apa", padahal ada yang nggak beres.'
      selected:
        title: "Itu wajar, dan Anda nggak sendirian."
        body: "Survei ini menanyakan apa yang sehari-hari Anda rasakan, seperti tadi. Sepuluh menit, tanpa nama."
      idle: "Kalau Anda mengenali salah satunya, itu wajar, dan Anda nggak sendirian."
      note: "Pilihan Anda di sini tidak disimpan. Ini bukan daftar untuk mendiagnosis diri."
      help_label: "Kalau terasa berat sekarang, lihat bantuan"
    meaning:
      kicker: "Makna tangguh"
      title: "Tangguh bukan berarti kuat terus"
      lead: "Dalam riset, ini disebut resiliensi psikologis: proses belajar beradaptasi, pelan-pelan."
      not_label: "Bukan"
      rows:
        - not: "pura-pura baik-baik saja"
          is: "Mengenali apa yang kita alami"
        - not: "menahan-nahan perasaan"
          is: "Mencari cara yang cocok, termasuk berhenti sebentar"
        - not: "menghadapi semuanya sendiri"
          is: "Mencari dan menerima dukungan"
    why_record:
      kicker: "Kenapa dicatat"
      title: "Yang nggak dicatat, nggak terlihat"
      lead: "Kebijakan yang baik butuh data yang baik, dan peneliti perlu mendengarnya langsung dari kita."
      compare:
        - title: "Sekali isi"
          caption: "Satu foto, satu momen."
          label: "Ilustrasi: satu titik terisi dan tiga titik kosong"
        - title: "Isi berulang"
          caption: "Terlihat perubahannya, dan apa yang membantu."
          label: "Ilustrasi: empat titik terisi yang terhubung garis"
      compare_note: "Ilustrasi, bukan data. Ikut satu kali pun tetap berharga."
      loop_title: "Ini riset oleh warga, untuk warga."
      loop:
        - title: "Warga mengisi"
          text: "Sepuluh menit, tanpa nama."
          icon: "clipboard-pen-line"
        - title: "Peneliti menganalisis"
          text: "Jawaban diolah dengan ID acak, bukan identitas."
          icon: "chart-column"
        - title: "Hasil kembali ke publik"
          text: "Temuan dibagikan dalam bahasa sehari-hari."
          icon: "book-open"
    if_join:
      kicker: "Kalau Anda ikut"
      title: "Sepuluh menit, tanpa nama"
      lead: "Anda memberi sedikit waktu, dan langsung mendapat laporan ringkas tentang diri Anda."
      give:
        title: "Yang Anda beri"
        items:
          - title: "Sepuluh menit."
            text: "Boleh berhenti kapan saja."
            icon: "clock"
          - title: "Jawaban jujur."
            text: "Tidak ada jawaban benar atau salah."
            icon: "message-circle"
          - title: "Bukan nama Anda."
            text: "ID Anonim dibuat otomatis."
            icon: "fingerprint-pattern"
      get:
        title: "Yang Anda dapat"
        report_title: "Laporan Anda"
        badge: "Contoh"
        caption: "Tersedia begitu survei selesai. Hasil skrining, bukan diagnosis."
      faq:
        - q: "Apakah saya harus memberi email?"
          a: "Tidak. Email hanya diperlukan jika Anda ingin menyimpan laporan, dan peneliti tidak bisa melihat email Anda. Tanpa email, laporan tersedia selama 24 jam."
        - q: "Siapa yang bisa melihat jawaban saya?"
          a: "Begitu selesai, sistem otomatis membuat ID Anonim. Peneliti hanya melihat ID acak, bukan identitas Anda. Data tidak dijual."
        - q: "Apakah ini diagnosis?"
          a: "Bukan. Laporan Anda adalah hasil skrining, bukan diagnosis. Kalau terasa berat sekarang, bantuan tersedia di [halaman FAQ](/faq/#bantuan)."
      link_label: "Baca detail studi dan cara data dikelola"
    trust:
      kicker: "Siapa di baliknya"
      title: "Riset terbuka, bisa diperiksa siapa pun"
      items:
        - label: "Peneliti utama"
          text: "Aly Lamuri, kandidat doktor di University of Groningen."
        - label: "Tim peneliti"
          text: "Bersama peneliti dari Universitas Indonesia, University of Groningen, University Medical Center Groningen, dan BINUS University."
        - label: "Kode terbuka"
          text: "Platform pengumpulan data bersifat open source di [github.com/konsulin-care](https://github.com/konsulin-care)."
        - label: "Data terbuka"
          text: "Data olahan dipublikasikan di Harvard Dataverse, tanpa informasi yang bisa dilacak ke individu."
      ethics_label: "Status etik:"
      about_label: "Tentang gerakan ini"
    final_cta:
      kicker: "Ikut serta"
      headline: "Jaga diri. Jaga sesama. Mulai dari sini."
      body: "Sepuluh menit dari Anda bisa membantu kita memahami resiliensi dan kesehatan mental bersama-sama. Sekecil apa pun, itu berarti."
      cta: "Mulai Survei (10 Menit)"
      faq_label: "Masih ada pertanyaan? Baca FAQ."

  social_media:
    github:
      enabled: true
      url: 'https://github.com/konsulin-care'
    facebook:
      enabled: true
      url: 'https://facebook.com/konsulin.care'
    instagram:
      enabled: true
      url: 'https://instagram.com/konsulin.care'
    twitter:
      enabled: true
      url: 'https://x.com/KonsulinCare'

