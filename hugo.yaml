baseURL: 'https://konsulin.care/'
csURL: 'https://cs.konsulin.care'
title: Konsulin
locale: id-ID
DefaultContentLanguage: id
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
canonifyURLs: true
pagination:
  pagerSize: 3
enableInlineShortcodes: true

security:
  node:
    permissions:
      # Tailwind v4 runs through @tailwindcss/postcss; Hugo's node wrapper
      # blocks these APIs unless postcss is allow-listed (defaults cover
      # only the tailwindcss binary).
      allowAddons:
        - postcss
        - tailwindcss
      allowWorker:
        - postcss
        - tailwindcss
      allowChildProcess:
        - postcss
        - tailwindcss

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: PT TEMAN KONSULIN SEJAWAT
  authorimage: ../assets/images/global/author.svg
  chatwoot_url: "{chatwoot_url}"
  chatwoot_token: "{chatwoot_token}"

  # Browser/meta alias for the homepage, distinct from the short title.
  meta_title: "Konsulin | Bareng Warga, Saling Jaga"
  description: "Gerakan warga untuk saling jaga."
  forward: "https://app.konsulin.care/research"
  # Nav login button: auth entry that returns the user to the research page.
  auth: "https://app.konsulin.care/auth?redirectToPath=/research"
  hashtag_url: 'https://instagram.com/konsulin.care'
  keywords:
    - riset kesehatan partisipatif
    - riset kesehatan bersama masyarakat
    - citizen science
    - kesehatan mental
    - resiliensi
    - ketangguhan psikologis
    - JadiTangguh
    - tes kesehatan mental
    - tes kejiwaan online
    - tes depresi online
    - tes kecemasan
    - tes kesehatan mental online gratis

  home:
    hero:
      hashtag: "#JadiTangguh"
      lines:
        - "bukan berarti nggak pernah capek."
        - "itu nggak harus sendirian."
        - "itu dilatih, bukan ditahan-tahan."
      body:
        - text: "Gerakan warga untuk saling jaga."
      primary_cta: "Mulai Survei (10 Menit)"
      trust:
        - "Privasi terjaga"
        - "Untuk penelitian"
        - "Laporan hasil langsung tersedia"
    recognition:
      kicker: "Kenali tandanya"
      title: "Stres jarang datang dengan nama"
      lead: "Banyak dari kita nggak menyebutnya masalah kesehatan mental. Kita menyebutnya hari yang panjang, atau sekadar capek."
      signals:
        - label: "Tubuh"
          text: "Perut mulas setiap menjelang *deadline*."
        - label: "Tidur"
          text: "Bangun tidur masih terasa kurang istirahat."
        - label: "Pikiran"
          text: "Banyak *pikiran*, bahkan saat mau istirahat."
        - label: "Uang"
          text: "Cemas tiap cek saldo di akhir bulan."
        - label: "Hubungan"
          text: "Mudah marah dengan orang terdekat, lalu menyesal."
        - label: "Diam"
          text: 'Bilang "nggak apa-apa", padahal ada yang nggak beres.'
      note: "Ini bukan daftar untuk mendiagnosis diri. Ini cara untuk saling mengenali."
      closing: "Kalau Anda mengenali salah satunya, Anda nggak sendirian. #JadiTangguh itu nggak harus sendirian."
      help_label: "Kalau terasa berat sekarang, lihat bantuan"
    meaning:
      kicker: "Makna tangguh"
      title: "Tangguh bukan berarti kuat terus"
      lead: "Menjadi tangguh artinya berani mengakui apa yang melemahkan kita, lalu tetap menemukan jalan untuk melangkah."
      cards:
        - muted: "Bukan nggak pernah capek"
          strong: "Tapi tahu kapan perlu berhenti sebentar"
        - muted: "Bukan ditahan-tahan"
          strong: "Tapi dilatih, sedikit demi sedikit"
        - muted: "Bukan sendirian"
          strong: "Tapi saling jaga"
    final_cta:
      kicker: "Ikut serta"
      headline: "Sepuluh menit Anda berharga"
      body: "Dalam sepuluh menit, Anda dapat membantu pengembangan program kesehatan yang lebih baik. Mulai dari satu partisipasi, dan simpan laporan Anda. Bangun riwayat partisipasi penelitian secara bertahap."
      cta: "Mulai Survei Sekarang"

  social_media:
    github:
      enabled: true
      url: 'https://github.com/konsulin-care'
    facebook:
      enabled: true
      url: 'https://facebook.com/konsulin.care'
    instagram:
      enabled: true
      url: 'https://instagram.com/konsulin.care'
    twitter:
      enabled: true
      url: 'https://x.com/KonsulinCare'

menu:
  main:
    - identifier: home
      name: Beranda
      url: /
      weight: 1
    - identifier: research
      name: Riset
      url: /research/
      weight: 10
    - identifier: faq
      name: FAQ
      url: /faq/
      weight: 20
    - identifier: about
      name: Tentang
      url: /about/
      weight: 30
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 40
  footer:
    - identifier: faq
      name: FAQ
      url: /faq/
      weight: 1
    - identifier: research
      name: Riset
      url: /research/
      weight: 10
    - identifier: about
      name: Tentang
      url: /about/
      weight: 20
    - identifier: contact
      name: Kontak
      url: /contact/
      weight: 50

taxonomies:
  category: Categories
  tag: Tags

privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false
  instagram:
    disable: false
    simple: false
  twitter:
    disable: false
    enableDNT: false
    simple: false
  vimeo:
    disable: false
    enableDNT: false
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true

module:
  hugoVersion:
    extended: true
    min: "0.104.0"

ignoreFiles:
  - "AGENTS.md"
  - "layouts/AGENTS.md"
  - "layouts/partials/AGENTS.md"
  - "docs/*.md"
