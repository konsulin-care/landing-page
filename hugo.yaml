baseURL: 'https://konsulin.care/'
csURL: 'https://cs.konsulin.care'
title: Konsulin
languageCode: en-us
DefaultContentLanguage: en
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
canonifyURLs: true
pagination:
  pagerSize: 3
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

security:
  node:
    permissions:
      # Tailwind v4 runs through @tailwindcss/postcss; Hugo's node wrapper
      # blocks these APIs unless postcss is allow-listed (defaults cover
      # only the tailwindcss binary).
      allowAddons:
        - postcss
        - tailwindcss
      allowWorker:
        - postcss
        - tailwindcss
      allowChildProcess:
        - postcss
        - tailwindcss

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: PT TEMAN KONSULIN SEJAWAT
  authorimage: ../assets/images/global/author.svg
  chatwoot_url: "{chatwoot_url}"
  chatwoot_token: "{chatwoot_token}"
  og_image: /images/positive-thinking-wide.png
  # Browser/meta alias for the homepage, distinct from the short title.
  meta_title: "Konsulin — Riset Kesehatan Bersama Masyarakat"
  description: "Ikut berkontribusi dalam riset kesehatan bersama masyarakat, peneliti, dan akademisi."
  forward: "https://app.konsulin.care/research"
  # Nav login button: auth entry that returns the user to the research page.
  auth: "https://app.konsulin.care/auth?redirectToPath=/research"
  disable_theme_toggle: false
  keywords:
    - riset kesehatan partisipatif
    - riset kesehatan bersama masyarakat
    - citizen science
    - kesehatan mental
    - aplikasi kesehatan jiwa
    - dokter psikolog
    - dokter psikiater
    - psikiater
    - psikiatri
    - psikolog online
    - konsultasi psikolog online
    - kesehatan mental
    - tes kesehatan mental
    - tes kejiwaan online
    - tes depresi online
    - tes kecemasan
    - tes kesehatan mental online gratis

  home:
    hero:
      headline: "Jadi bagian dari riset kesehatan."
      body:
        - text: "Bagikan pengalaman Anda dan bantu menghasilkan pengetahuan kesehatan bersama."
      primary_cta: "Ikut Berkontribusi"
      trust:
        - text: "Identitas Anda tidak diberikan kepada peneliti."
    citizen_science:
      kicker: "Partisipasi warga"
      title: "Ikut ambil bagian dalam riset."
      frames:
        - title: "Ceritakan."
          text: "Bagikan pengalaman kesehatan Anda."
        - title: "Tanyakan."
          text: "Ajukan pertanyaan yang ingin Anda pahami."
        - title: "Pahami."
          text: "Ikuti hasil penelitian yang Anda bantu."
      cta: "Ikut Berkontribusi"
    process:
      kicker: "Proses"
      title: "Dari pengalaman menjadi pengetahuan."
      steps:
        - num: "01"
          title: "Tentukan pertanyaan"
          text: "Anda dapat mengusulkan pertanyaan atau hipotesis."
        - num: "02"
          title: "Kumpulkan data"
          text: "Data dikumpulkan sesuai tujuan dan persetujuan Anda."
        - num: "03"
          title: "Pelajari bersama"
          text: "Peneliti membantu menganalisis data secara ilmiah."
        - num: "04"
          title: "Pahami hasilnya"
          text: "Anda dapat melihat pola dan temuan dari data bersama."
      cta: "Ikut Berkontribusi"
    transparency:
      kicker: "Transparansi"
      title: "Anda bisa melihat apa yang sedang dikumpulkan."
      copy:
        - text: "Konsulin menampilkan data agregat tentang proses pengumpulan."
        - text: "Anda dapat melihat jumlah data dan jenis data yang terkumpul."
      labels:
        data_count: "Data terkumpul"
        types: "Jenis data"
        contributors: "Kontributor"
        updated: "Terakhir diperbarui"
      data_count: 12482
      types: 5
      contributors: 1836
      updated: "Hari ini"
      supporting: "Transparansi membantu Anda memahami bagaimana kontribusi Anda digunakan."
    privacy:
      kicker: "Privasi"
      title: "Data Anda tetap berada dalam kendali Anda."
      assurances:
        - title: "Identitas terlindungi"
          text: "Identitas Anda tidak diberikan kepada peneliti."
        - title: "Nomor unik acak"
          text: "Data penelitian menggunakan nomor unik yang dibuat secara acak."
        - title: "Persetujuan Anda"
          text: "Anda mengetahui tujuan penggunaan data sebelum menyetujuinya."
      withdrawal:
        title: "Anda dapat menarik persetujuan."
        text: "Data yang masih dapat dihapus akan dihapus setelah penarikan persetujuan. Data yang telah diproses dapat dikecualikan sesuai ketentuan penelitian."
      policy_link: "Pelajari kebijakan data"
    collaboration:
      kicker: "Kolaborasi"
      title: "Masyarakat dan peneliti membawa keahlian yang berbeda."
      public_card:
        title: "Masyarakat"
        text: "Membawa pengalaman, pertanyaan, dan konteks kehidupan nyata."
      researcher_card:
        title: "Peneliti"
        text: "Membawa metode, analisis, dan pengetahuan ilmiah."
      connector: "Bersama, keduanya membantu menghasilkan riset yang relevan dengan kehidupan masyarakat."
    impact:
      kicker: "Dampak"
      title: "Temuan yang dapat dipakai bersama."
      copy:
        - text: "Riset yang baik membantu kita memahami masalah kesehatan dengan lebih baik."
        - text: "Temuannya dapat menjadi masukan bagi masyarakat, peneliti, dan pembuat kebijakan."
      cta: "Ikut Berkontribusi"
    cta_section:
      kicker: "Bergabung"
      title: "Punya pengalaman yang ingin dipahami?"
      subtitle: "Jadikan pengalaman Anda menjadi bagian dari riset kesehatan."
      primary_cta: "Ikut Berkontribusi"
      secondary_cta: "Pelajari cara kerja Konsulin"

  social_media:
    github:
      enabled: true
      url: 'https://github.com/konsulin-care'
    facebook:
      enabled: true
      url: 'https://facebook.com/konsulin.care'
    instagram:
      enabled: true
      url: 'https://instagram.com/konsulin.care'
    twitter:
      enabled: true
      url: 'https://x.com/KonsulinCare'

