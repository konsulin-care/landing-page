enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
canonifyURLs: true
pagination:
  pagerSize: 3
darkmode_js:
  - assets/js/darkmode.js
enableInlineShortcodes: true

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
      typographer:
        apostrophe: '&rsquo;'
        disable: false
        ellipsis: '&hellip;'
        emDash: '&mdash;'
        enDash: '&ndash;'
        leftAngleQuote: '&laquo;'
        leftDoubleQuote: '&ldquo;'
        leftSingleQuote: '&lsquo;'
        rightAngleQuote: '&raquo;'
        rightDoubleQuote: '&rdquo;'
        rightSingleQuote: '&rsquo;'
    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
  author: PT TEMAN KONSULIN SEJAWAT
  authorimage: ../assets/images/global/author.svg
  chatwoot_url: "{chatwoot_url}"
  chatwoot_token: "{chatwoot_token}"
  og_image: /images/positive-thinking-wide.png
  moto: "Wellness kit in your pocket"
  description: "Buat kamu yang peduli kesehatan mental"
  long_description: "Pakai Konsulin, kesehatan kamu selalu dalam genggaman. Lagi kepingin curhat? Atau mau skrining kesehatan? Yuk, Konsulin dulu!"
  button: "Coba sekarang"
  forward: "https://wa.me/message/VZLSO2PDYM2YG1"
  disable_theme_toggle: false
  disable_stay_uptodate: false
  keywords:
    - kesehatan mental
    - aplikasi kesehatan jiwa
    - dokter psikolog
    - dokter psikiater
    - psikiater
    - psikiatri
    - konsultasi psikolog online
    - konsultasi psikologi
    - psikiater online
    - psikolog online
    - tes mental
    - cek depresi
    - cek kesehatan mental
    - cek mental
    - cek mental health
    - depresi test
    - kalkulator kesehatan mental
    - kalkulator kesehatan mental health
    - kalkulator kesehatan mental online
    - kalkulator mental
    - kesehatan mental
    - link tes mental health
    - mental health tes
    - tes depresi
    - tes depresi online
    - tes gangguan mental
    - tes gangguan jiwa
    - tes kejiwaan
    - tes kejiwaan online
    - tes kesehatan mental
    - tes kesehatan mental online
    - tes kesehatan mental online gratis
    - tes kesehatan mental remaja
    - tes mental
    - tes mental health
    - tes mental health gratis
    - tes psikologi mental
    - tes sehat mental

  p1:
    heading: "Tahukah kamu...?"
    image: "images/pages/our-mission.png"
    button: "Mulai di WhatsApp"
    content:
      - text: "Kebanyakan aplikasi kesehatan tidak terbuka tentang bagaimana data kita digunakan. Kita tidak pernah tahu: infrastruktur apa yang menjaga data kita? Apakah sistem ini aman dan transparan?"
      - text: "Konsulin beroperasi dengan infrastruktur terbuka. Kamu bisa verifikasi bagaimana sistem kami bekerja untuk memproses datamu."
      - text: "Dengan Konsulin, kamu bisa gunakan fitur-fiturnya gratis: jurnal harian untuk bercerita, skrining kesehatan untuk memahami kondisimu saat ini, dan menjadwalkan sesi dengan klinisi profesional. Semuanya tanpa ribet, tanpa biaya di depan."
  p2:
    heading: "Apa kata mereka tentang sehat jiwa?"
    button: "Mulai di WhatsApp"
    content:
      - text: "Kami mendirikan Konsulin karena kami percaya pentingnya kesehatan mental, terutama bagi para profesional muda yang menghadapi berbagai tekanan dan tantangan dalam kehidupan sehari-hari. Kami melihat banyak orang yang kesulitan mendapatkan akses ke tes kesehatan mental yang kredibel dan berbasis bukti ilmiah, serta dukungan yang mereka butuhkan."
      - text: "Dengan Konsulin, kami ingin membuat kesehatan mental lebih mudah dijangkau oleh semua orang. Konsulin didesain sebagai platform yang menyediakan tes kesehatan mental yang akurat serta memfasilitasi kolaborasi antara masyarakat, klinisi, dan akademisi. Kami ingin setiap orang bisa mendapatkan wawasan yang mendalam tentang kondisi psikologis mereka dan mendapatkan panduan yang tepat dari para ahli."
    social_posts:
      - url: "https://www.threads.com/@brindaip/post/C_kNjNaxwNx"
      - url: "https://www.threads.com/@lightgivers/post/DWDG_AmCQnu"
      - url: "https://www.threads.com/@biandaspkj/post/DSXgxbbkYWd"
      - url: "https://www.threads.com/@psikolog.rut/post/DPbfNk-E1FL"
      - url: "https://www.threads.com/@seandybilla/post/DTVXbK_El76"
      - url: "https://www.threads.com/@hanaboone/post/DESU-Z0SeUS"
  p3:
    heading: "Mitra Konsulin"
    content:
      - text: "Melalui kolaborasi antara klinisi top dan akademisi hebat, Konsulin menawarkan aplikasi kesehatan personal yang didukung ilmu terkini. Yuk, bergabung dengan Konsulin dan rasakan perubahan positif dalam hidup kamu."
    links:
      - text: Kenali mitra Konsulin
        url: "partner"
    logos:
      - identifier: a
        image: "images/global/sample-logo.svg"
        alt: "a"
      - identifier: b
      - identifier: c
      - identifier: d
      - identifier: e
      - identifier: f
  p4:
    heading: "From the blog"
    content:
      - text: "Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ipsa libero labore natus atque, ducimus sed."
  p5:
    heading: "Stay Up to Date"
    content:
      - text: "Mau update terbaru dari Konsulin? Silakan masukkan alamat email kamu ya!"
    action: "https://formsubmit.co/1ce5a3c4a13420eab3f929d03891849a"
    label: "Email address"
    placeholder: "Masukkan alamat email kamu"
    button: "Kabari aku"

